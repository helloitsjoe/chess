<html>
  <head>
    <title>Chess</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
  </head>
  <body>
    <main class="main">
      <div id="board-container">
        <div id="board-root"></div>
        <div id="pieces-root"></div>
      </div>
      <div id="other-container">
        <div id="controls-container">
          <div id="turn" class="turn"></div>
          <div class="btn-group">
            <button id="undo-button">Undo</button>
            <button id="redo-button">Redo</button>
            <button id="save-button">Save</button>
            <button id="load-button">Load</button>
            <button id="export-button">Export</button>
            <button id="import-button">Import</button>
          </div>
          <label for="show-hints">
            <input type="checkbox" id="show-hints" checked />Show hints on
            move</label
          >
          <label for="lock-check">
            <input type="checkbox" id="lock-check" />Lock moves on check</label
          >
        </div>
        <div id="taken-container">
          <div id="white-taken" class="taken"></div>
          <div id="black-taken" class="taken"></div>
        </div>
      </div>
    </main>
    <script type="module" src="./index.js"></script>
  </body>
</html>
